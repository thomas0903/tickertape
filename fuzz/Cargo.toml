[package]
name = "tickertape-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tickertape = { path = "../crates/tickertape" }

[workspace]

[[bin]]
name = "parse_segment"
path = "fuzz_targets/parse_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_record"
path = "fuzz_targets/decode_record.rs"
test = false
doc = false
bench = false

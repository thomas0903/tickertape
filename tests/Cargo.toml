[package]
name = "tickertape-tests"
description = "Integration, cross-process and crash tests for tickertape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
tickertape = { workspace = true, features = ["fault-injection"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "recovery"
path = "recovery.rs"

[[test]]
name = "lock"
path = "lock.rs"

[[test]]
name = "cross_process"
path = "cross_process.rs"

[[test]]
name = "kill_loop"
path = "kill_loop.rs"

[[test]]
name = "disk_full"
path = "disk_full.rs"

[[test]]
name = "checkpoint"
path = "checkpoint.rs"

[[test]]
name = "slow_reader"
path = "slow_reader.rs"

[[test]]
name = "durable_only"
path = "durable_only.rs"

[lints]
workspace = true

[[test]]
name = "retention"
path = "retention.rs"

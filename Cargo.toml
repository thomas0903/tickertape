[workspace]
resolver = "3"
members = [
    "crates/tickertape",
    "crates/tickertape-cli",
    "tests",
    "benches",
    "examples",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. CI checks it in the `msrv` job; bump it only with a CHANGELOG entry.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomas0903/tickertape"
homepage = "https://github.com/thomas0903/tickertape"
authors = ["The tickertape contributors"]

[workspace.dependencies]
tickertape = { path = "crates/tickertape", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

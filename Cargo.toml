[workspace]
resolver = "3"
members = [
    "crates/tickertape",
    "crates/tickertape-cli",
    "crates/tickertape-ffi",
    "tests",
    "benches",
    "examples",
]
exclude = ["fuzz", "compare", "bindings/python", "integrations"]

[workspace.package]
version = "1.0.0"
edition = "2024"
# MSRV. CI checks it in the `msrv` job; bump it only with a CHANGELOG entry.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomas0903/tickertape"
homepage = "https://github.com/thomas0903/tickertape"
authors = ["The tickertape contributors"]

[workspace.dependencies]
tickertape = { path = "crates/tickertape", version = "1.0.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `tickertape_test_panic_abort` is private to one test of the C ABI crate (crates/tickertape-ffi/src/lib.rs).
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(loom)",
    "cfg(fuzzing)",
    "cfg(tickertape_force_soft_crc)",
    "cfg(tickertape_test_panic_abort)",
] }
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

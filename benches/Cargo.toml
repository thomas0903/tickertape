[package]
name = "tickertape-bench"
description = "Benchmarks for tickertape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tickertape.workspace = true
hdrhistogram = { version = "7.5", default-features = false }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "append"
harness = false

[[bench]]
name = "replay"
harness = false

[lints]
workspace = true

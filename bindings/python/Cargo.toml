[package]
name = "tickertape-python"
# Keep in step with `[workspace.package].version` in the root Cargo.toml; `release.py prepare` checks it.
# maturin takes the wheel's version from here (pyproject.toml declares `version` as dynamic).
version = "0.4.0"
edition = "2024"
# PyO3 0.30 needs Rust 1.85, the same as the workspace MSRV; this crate is checked with stable Rust only.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomas0903/tickertape"
description = "Python bindings for the tickertape event journal (built with maturin; not published to crates.io)"
publish = false
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Bind the core crate directly (ADR 0029); never the C ABI crate.
tickertape = { path = "../../crates/tickertape" }
# abi3-py311: one stable-ABI wheel per platform for CPython 3.11 and newer (ADR 0029).
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[features]
# Test-only methods that can wedge a handle or pause a read (`_lock_forever_for_testing`, `_arm_commit_race_for_testing`,
# `_race_commit_for_testing`, `_arm_signal_after_commit_for_testing`, `_signal_after_commit_for_testing`,
# `_returning_for_testing`). The CI test builds enable it; release wheels are built without it (ADR 0029).
test-hooks = []

# Deliberately not a member of the root workspace (see `exclude` there): PyO3 and its lockfile stay separate.
[workspace]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# Generates include/tickertape.h. Regenerate after changing the C ABI (CI fails on any difference):
#   cbindgen --config crates/tickertape-ffi/cbindgen.toml --crate tickertape-ffi --output crates/tickertape-ffi/include/tickertape.h
# Use cbindgen 0.29.4 (`cargo install cbindgen --version 0.29.4 --locked`); other versions may format differently.
language = "C"
cpp_compat = true
include_guard = "TICKERTAPE_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
style = "both"
documentation_style = "doxy"
line_length = 120
header = """/*
 * tickertape C ABI (C99 / C++11). SPDX-License-Identifier: MIT OR Apache-2.0
 *
 * Read docs/c-api.md first: ownership, record lifetimes, errors, threading, durability and versioning.
 *
 * Conventions used by every function:
 * - Functions return a tickertape_status: TICKERTAPE_OK (0) or TICKERTAPE_NONE (1) on success, a negative
 *   TICKERTAPE_E_* code on failure. After a failure, tickertape_last_error_message() and friends describe it
 *   (per thread).
 * - Handles are opaque. Free each with its *_close / *_free function; NULL is ignored there. A close that returns
 *   anything but TICKERTAPE_E_BUSY has freed the handle: never retry it. NULL where a pointer is required returns
 *   TICKERTAPE_E_INVALID_ARGUMENT. Use after close, double close and concurrent use of one handle from several
 *   threads are undefined behaviour (a journal status sample is the exception: see tickertape_journal_status).
 *   Allocation failure aborts the process; no function returns NULL for it.
 * - Pointers must be valid and aligned for their type. Paths are NUL-terminated byte strings.
 * - Input and output memory of one call must not overlap, and inputs must stay unmodified until the call returns.
 *   Output storage is the caller's. Each function's Safety section names its regions.
 * - Before 1.0 the ABI is unstable: check at start-up that the library is exactly this header's version (see
 *   TICKERTAPE_ABI_VERSION for the check, which also covers 1.x).
 * - Visible is not durable: a record is visible to readers when an append returns, and durable only after a later
 *   successful checkpoint (tickertape_writer_checkpoint, or a finished tickertape_writer_request_checkpoint;
 *   docs/crash-contract.md).
 */"""
autogen_warning = """/* Generated by cbindgen 0.29.4 from crates/tickertape-ffi; do not edit. See crates/tickertape-ffi/cbindgen.toml. */"""

[export]
include = ["tickertape_status_code", "tickertape_corrupt_reason", "tickertape_recovery_policy", "tickertape_helper_cpus", "tickertape_timeout", "tickertape_head_end", "tickertape_checkpoint_problem", "tickertape_age_unknown", "tickertape_lag_unknown", "tickertape_beacon_state", "tickertape_readers_dir_state"]

[parse]
parse_deps = false

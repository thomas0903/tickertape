[package]
name = "tickertape"
description = "A local, append-only event journal on memory-mapped segment files, with live cross-process readers and replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Local tooling files that may exist in a checkout; never part of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md"]
keywords = ["journal", "mmap", "event-log", "trading", "ipc"]
categories = ["database-implementations", "filesystem", "finance"]

[features]
# Test-only failure points (see src/fault.rs). Not part of the stable API; never enable in production.
fault-injection = []

[dependencies]
libc = "0.2"
thiserror = "2"
crc32c = "0.6"
# Safe, atomic no-replace rename on Linux/macOS (MIT OR Apache-2.0 WITH LLVM-exception).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true

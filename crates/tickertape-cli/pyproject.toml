# The CLI as a Python wheel (ADR 0031), so that `pipx install tickertape-cli` and `uvx --from tickertape-cli tickertape`
# install the same `tickertape` executable as `cargo install tickertape-cli`. maturin's `bin` bindings compile the
# binary and put it in the wheel's scripts; the wheel contains no Python code. Built and published by
# .github/workflows/python-wheels.yml. Not part of the crate published to crates.io (see `exclude` in Cargo.toml).
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
# The PyPI distribution name, promised to the owner for the trusted publisher (docs/playbooks/release-checklist.md).
name = "tickertape-cli"
description = "The tickertape command-line tool: tail, inspect, verify, export, summarize and archive tickertape journals"
readme = "README.md"
# The version comes from the workspace's Cargo.toml, which `release.py prepare` keeps in step with the release tag.
dynamic = ["version"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "The tickertape contributors" }]
keywords = ["journal", "mmap", "event-log", "trading", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thomas0903/tickertape"
Documentation = "https://github.com/thomas0903/tickertape/blob/main/docs/cli.md"
Changelog = "https://github.com/thomas0903/tickertape/blob/main/CHANGELOG.md"
Issues = "https://github.com/thomas0903/tickertape/issues"

[tool.maturin]
bindings = "bin"
# Strip symbols from release wheels; the source is public.
strip = true
locked = true

[package]
name = "tickertape-cli"
description = "Tools to tail, inspect, verify, export, summarize and archive tickertape journals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Local tooling files that may exist in a checkout, and a test that needs the repository's compatibility fixtures
# (tests/compat/); never part of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md", "tests/compat_fixtures.rs"]
keywords = ["journal", "mmap", "event-log", "trading", "cli"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "tickertape"
path = "src/main.rs"
# The binary shares its name with the library crate; documenting both would collide (cargo issue 6313).
doc = false

[dependencies]
tickertape.workspace = true
base64 = "0.22"
clap = { version = "~4.5.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
parquet = { version = "59", default-features = false, features = ["snap"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true

# `cargo binstall tickertape-cli` installs the CLI archive from the GitHub release instead of compiling it. On Linux it
# always uses the static musl archive, which needs no particular glibc. CI checks these templates against the names
# that `.github/scripts/release.py package` gives the archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tickertape-v{ version }-{ target }{ archive-suffix }"
bin-dir = "tickertape-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# Never a third-party build service: only the project's own archives (or, if the user agrees, a source build).
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tickertape-v{ version }-x86_64-unknown-linux-musl{ archive-suffix }"
bin-dir = "tickertape-v{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tickertape-v{ version }-aarch64-unknown-linux-musl{ archive-suffix }"
bin-dir = "tickertape-v{ version }-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"

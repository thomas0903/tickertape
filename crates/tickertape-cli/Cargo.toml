[package]
name = "tickertape-cli"
description = "Read-only tools to tail, inspect, verify, export and summarize tickertape journals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Local tooling files that may exist in a checkout; never part of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md"]
keywords = ["journal", "mmap", "event-log", "trading", "cli"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "tickertape"
path = "src/main.rs"
# The binary shares its name with the library crate; documenting both would collide (cargo issue 6313).
doc = false

[dependencies]
tickertape.workspace = true
base64 = "0.22"
clap = { version = "~4.5.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
parquet = { version = "59", default-features = false, features = ["snap"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true

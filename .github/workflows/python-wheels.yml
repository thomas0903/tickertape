name: python-wheels

# Builds the Python bindings' sdist and wheels (ADR 0029) and, for an accepted release tag, publishes them to PyPI.
#
# - Pull requests that touch the bindings and on-demand runs only build and smoke-test; nothing is uploaded.
# - A `v*` tag push (the release, alongside release.yml) builds from the tag. The PyPI step runs only if the tag
#   passes `release.py prepare` (stable syntax, versions, ancestry on main, green CI) AND the repository variable
#   PYPI_PUBLISHING is `enabled`, which the maintainer sets after the one-time PyPI setup in
#   docs/playbooks/release-checklist.md. It never runs for pull requests or branch pushes.

on:
  push:
    tags: ['v*']
  pull_request:
    # The wheels compile the core crate too: a core change can break a musllinux or aarch64 wheel, and that must show
    # up on the pull request, not at release time after the crates are published.
    paths:
      - 'bindings/python/**'
      - 'crates/tickertape/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python-wheels.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build; defaults to the ref the workflow runs on
        required: false
        type: string
      publish:
        description: Publish to PyPI (only for an existing release tag given as ref, after the one-time PyPI setup)
        type: boolean
        default: false

permissions:
  contents: read

# Release jobs do not use dependency caches; deny cache access even to executed build code.
cache-mode: none

concurrency:
  group: python-wheels-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: 1.16.0

jobs:
  prepare:
    # Only runs when this run may publish: a tag push, or a manual run with publish=true.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the fully qualified tag: an unqualified name could resolve to a branch called like the tag.
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.ref) }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Check tag, versions (including the bindings), main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: python3 automation/.github/scripts/release.py prepare --source source --tag "$RELEASE_TAG" --notes release-notes.md

  wheels:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    name: wheel (${{ matrix.platform }} ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: manylinux, target: x86_64, manylinux: auto }
          - { os: ubuntu-22.04-arm, platform: manylinux, target: aarch64, manylinux: auto }
          - { os: ubuntu-22.04, platform: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-22.04-arm, platform: musllinux, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, platform: macos, target: x86_64 }
          - { os: macos-15, platform: macos, target: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha || inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Oldest and newest supported CPython: the abi3 wheel must load in both.
          python-version: |
            3.11
            3.15
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -m bindings/python/Cargo.toml
      # The release wheel is built without the `test-hooks` feature: the test suite runs against it as shipped, and
      # the tests that need the hooks skip (ADR 0029).
      - name: Test the wheel on the runner (test suite and end-to-end example, oldest and newest Python)
        if: matrix.platform != 'musllinux'
        run: |
          for python in python3.11 python3.15; do
            "$python" -m venv "$RUNNER_TEMP/venv-$python"
            "$RUNNER_TEMP/venv-$python/bin/python" -m pip install dist/*.whl pytest
            "$RUNNER_TEMP/venv-$python/bin/python" -c \
              'import tickertape as tt; assert not hasattr(tt.Reader, "_race_commit_for_testing"), "test hooks in a release wheel"'
            (cd bindings/python && TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/venv-$python/bin/python" -m pytest -p no:cacheprovider)
            "$RUNNER_TEMP/venv-$python/bin/python" bindings/python/examples/end_to_end.py "$RUNNER_TEMP/journal-$python"
          done
      - name: Test the musllinux wheel in Alpine (test suite and end-to-end example)
        if: matrix.platform == 'musllinux'
        run: |
          # Multi-arch index digests, pinned like the actions; update them together with the tags.
          for image in \
              python:3.11-alpine@sha256:7fbad8e4652eae0186429a6f26cf5b23e27e8c6fd7ac4d0cfd7a6988cdeea1e1 \
              python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd; do
            docker run --rm -v "$PWD:/src:ro" -w /src "$image" sh -ec '
              python -m venv /tmp/venv && /tmp/venv/bin/pip install dist/*.whl pytest
              /tmp/venv/bin/python -c "import tickertape as tt; assert not hasattr(tt.Reader, \"_race_commit_for_testing\")"
              cd bindings/python && /tmp/venv/bin/python -m pytest -p no:cacheprovider && cd /src
              /tmp/venv/bin/python bindings/python/examples/end_to_end.py /tmp/journal'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha || inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml
      - name: Build and install from the sdist in a clean environment, then run the example
        run: |
          rustup toolchain install stable --profile minimal
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/venv/bin/python" bindings/python/examples/end_to_end.py "$RUNNER_TEMP/journal"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, wheels, sdist]
    # Never for pull requests or branches: only a tag accepted by `prepare`, and only once PyPI is configured.
    if: >-
      always() && needs.prepare.result == 'success' && needs.wheels.result == 'success' &&
      needs.sdist.result == 'success' && vars.PYPI_PUBLISHING == 'enabled' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: List the distributions
        run: ls -l dist
      # Trusted Publishing: exchanges this job's OIDC identity for a short-lived PyPI token. No stored secret.
      # Existing files are skipped so that a rerun after a partial upload completes the release.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

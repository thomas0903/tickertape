name: soak

# The long soak (tests/soak.rs): kills, recovery, injected corruption and storage-full failures, retention and
# readers of both kinds, combined, for 90 minutes per platform. Pull requests run a 20 s smoke in the long tests.
#
# Weekly rather than nightly: commits to main are infrequent, so most nightly runs would repeat the same commit,
# and one 90-minute run per platform finds more than seven short ones. macOS runners are also the scarcest. Start a
# run by hand (with a duration) after a change to recovery, the writer or the readers.
on:
  schedule:
    - cron: '17 3 * * 0' # Sundays 03:17 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration per platform in minutes (1 to 300)
        required: true
        default: '90'

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  soak:
    name: soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tickertape-tests --release --locked --tests --bins
      - name: Soak
        env:
          MINUTES: ${{ inputs.minutes || '90' }}
          TICKERTAPE_SOAK_ARTIFACTS: ${{ runner.temp }}/soak-failures
        run: |
          case "$MINUTES" in
            '' | *[!0-9]*) echo "minutes must be a whole number" >&2; exit 1 ;;
          esac
          if [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 300 ]; then
            echo "minutes must be between 1 and 300" >&2
            exit 1
          fi
          export TICKERTAPE_SOAK_SECS=$((MINUTES * 60))
          cargo test -p tickertape-tests --release --locked --test soak -- --ignored --nocapture
      # The failing journal, archive, reader and writer logs, and FAILURE.txt with the seed and a replay command.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: soak-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/soak-failures
          if-no-files-found: ignore
          retention-days: 30

  old-readers:
    name: old readers on new journals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - run: rustup show active-toolchain || rustup toolchain install
      - run: tests/compat/generate.sh --check-old-readers
      - run: EXPORTS=30 tests/compat/v1.0.0-ignores-seek-index.sh

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.4.0
        required: true
        type: string
      publish:
        description: Publish missing crates and create a GitHub release (false only adds binaries to an existing release)
        type: boolean
        default: false
      verify_publishing:
        description: Test trusted publishing authentication without uploading crates
        type: boolean
        default: false

permissions:
  contents: read

# Release jobs do not use dependency caches; deny cache access even to executed build code.
cache-mode: none

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      # Keep tooling separate: old release tags do not contain these scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Check tag, versions, main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 automation/.github/scripts/release.py prepare --source source --tag "$RELEASE_TAG" --notes release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install stable Rust and the native target
        working-directory: source
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
      - name: Test and build the release CLI on its native architecture
        working-directory: source
        run: |
          cargo test --locked --release -p tickertape -p tickertape-cli --target "$TARGET"
          cargo build --locked --release -p tickertape-cli --target "$TARGET"
          "target/$TARGET/release/tickertape" --version
      - name: Package CLI, licences and installation notes
        run: python3 automation/.github/scripts/release.py package --source source --tag "$RELEASE_TAG" --target "$TARGET" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' || inputs.verify_publishing
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install stable Rust
        working-directory: source
        run: rustup toolchain install stable --profile minimal
      - name: Authenticate with crates.io through GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Verify package preparation
        working-directory: source
        run: cargo publish --dry-run --locked -p tickertape -p tickertape-cli
      - name: Publish library, then CLI (skip identical published versions)
        if: needs.prepare.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 automation/.github/scripts/release.py publish --source source --version "$VERSION" --sha "$RELEASE_SHA"

  github-release:
    needs: [prepare, build, publish]
    if: >-
      always() && needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CREATE_RELEASE: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: metadata
      - name: Attach archives and SHA256SUMS, then publish the release
        run: |
          create=()
          if [[ "$CREATE_RELEASE" == 'true' ]]; then create=(--create); fi
          python3 .github/scripts/release.py github-release --tag "$RELEASE_TAG" --artifacts dist --notes metadata/release-notes.md "${create[@]}"

  verify:
    needs: [prepare, github-release]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published source checksums and docs.rs builds
        run: python3 .github/scripts/release.py verify --version "$VERSION" --sha "$RELEASE_SHA"
      - name: Install and smoke-test the CLI from crates.io
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install tickertape-cli --version "$VERSION" --locked --root "$RUNNER_TEMP/registry-install"
          test "$("$RUNNER_TEMP/registry-install/bin/tickertape" --version)" = "tickertape $VERSION"
          "$RUNNER_TEMP/registry-install/bin/tickertape" --help
      - name: Download, verify and smoke-test the Linux binary archive
        run: |
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir downloaded
          cd downloaded
          grep 'x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS | sha256sum --check --strict
          tar -xzf "tickertape-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
          test "$("tickertape-$RELEASE_TAG-x86_64-unknown-linux-gnu/tickertape" --version)" = "tickertape $VERSION"

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.4.0
        required: true
        type: string
      publish:
        description: Publish missing crates and create a GitHub release (false only adds binaries to an existing release)
        type: boolean
        default: false
      verify_publishing:
        description: Test trusted publishing authentication without uploading crates
        type: boolean
        default: false

permissions:
  contents: read

# Release jobs do not use dependency caches; deny cache access even to executed build code.
cache-mode: none

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      # Whether the tag's CLI manifest has cargo-binstall metadata (older tags do not).
      binstall: ${{ steps.prepare.outputs.binstall }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      # Keep tooling separate: old release tags do not contain these scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the fully qualified tag: an unqualified name could resolve to a branch called like the tag.
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Check tag, versions, cargo-binstall metadata, main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 automation/.github/scripts/release.py prepare --source source --tag "$RELEASE_TAG" --notes release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # Static builds with Rust's bundled musl (no C toolchain beyond the runner's linker; no C dependencies).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install stable Rust and the native target
        working-directory: source
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
      - name: Install cargo-auditable and cargo-cyclonedx (checksum-verified prebuilt binaries)
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9
          fallback: none
      # `cargo auditable` embeds the locked dependency list in a `.dep-v0` section of the binary. Testing through it
      # too means the tests and the archive use the same build of the CLI.
      - name: Test and build the release CLI on its native architecture
        working-directory: source
        run: |
          cargo auditable test --locked --release -p tickertape -p tickertape-cli --target "$TARGET"
          cargo auditable build --locked --release -p tickertape-cli --target "$TARGET"
          "target/$TARGET/release/tickertape" --version
      - name: Check the embedded dependency list
        working-directory: source
        run: |
          binary="target/$TARGET/release/tickertape"
          case "$TARGET" in
            *-apple-darwin) otool -l "$binary" | grep -q 'sectname .dep-v0' ;;
            *) readelf -SW "$binary" | grep -q ' \.dep-v0 ' ;;
          esac
      - name: Prove the musl binary is static and runs without any C library
        if: endsWith(matrix.target, '-linux-musl')
        working-directory: source
        run: |
          binary="target/$TARGET/release/tickertape"
          file "$binary" | tee file.txt
          grep -E -q 'statically linked|static-pie linked' file.txt
          # For the log: glibc's ldd words static and static-pie executables differently; readelf decides below.
          ldd "$binary" || true
          if readelf -lW "$binary" | grep -q INTERP || readelf -dW "$binary" | grep -q NEEDED; then
            echo "::error::$binary needs a dynamic loader or shared libraries"
            exit 1
          fi
          # An empty root directory: no loader, no libc, no /proc. Only the binary.
          root="$(mktemp -d)"
          cp "$binary" "$root/tickertape"
          test "$(sudo chroot "$root" /tickertape --version)" = "tickertape ${RELEASE_TAG#v}"
          set +e
          sudo chroot "$root" /tickertape verify /missing
          status=$?
          set -e
          test "$status" -eq 1
      - name: Package CLI, licences and installation notes
        run: python3 automation/.github/scripts/release.py package --source source --tag "$RELEASE_TAG" --target "$TARGET" --output dist
      - name: Write the CycloneDX SBOM of the locked dependency graph for this target
        run: python3 automation/.github/scripts/release.py sbom --source source --tag "$RELEASE_TAG" --target "$TARGET" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Attest in a job that runs no build code: dependency build scripts never see the OIDC token used for signing.
  attest:
    needs: [prepare, build]
    name: Attest (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      attestations: write
    timeout-minutes: 10
    env:
      FILE_STEM: tickertape-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist
      - name: Build provenance for the archive and its SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.FILE_STEM }}.tar.gz
            dist/${{ env.FILE_STEM }}.cdx.json
      - name: SBOM attestation for the archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.FILE_STEM }}.tar.gz
          sbom-path: dist/${{ env.FILE_STEM }}.cdx.json

  publish:
    # After `attest`: publishing a crate cannot be undone, so every step that can fail without publishing runs first.
    needs: [prepare, build, attest]
    if: needs.prepare.outputs.publish == 'true' || inputs.verify_publishing
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install stable Rust
        working-directory: source
        run: rustup toolchain install stable --profile minimal
      - name: Authenticate with crates.io through GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Verify package preparation
        working-directory: source
        run: cargo publish --dry-run --locked -p tickertape -p tickertape-cli
      - name: Publish library, then CLI (skip identical published versions)
        if: needs.prepare.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 automation/.github/scripts/release.py publish --source source --version "$VERSION" --sha "$RELEASE_SHA"

  github-release:
    needs: [prepare, build, attest, publish]
    if: >-
      always() && needs.prepare.result == 'success' && needs.build.result == 'success' &&
      needs.attest.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CREATE_RELEASE: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: metadata
      - name: Attach archives, SBOMs and SHA256SUMS, then publish the release
        run: |
          create=()
          if [[ "$CREATE_RELEASE" == 'true' ]]; then create=(--create); fi
          python3 .github/scripts/release.py github-release --tag "$RELEASE_TAG" --artifacts dist --notes metadata/release-notes.md "${create[@]}"

  verify:
    needs: [prepare, github-release]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published source checksums and docs.rs builds
        run: python3 .github/scripts/release.py verify --version "$VERSION" --sha "$RELEASE_SHA"
      - name: Install and smoke-test the CLI from crates.io
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install tickertape-cli --version "$VERSION" --locked --root "$RUNNER_TEMP/registry-install"
          test "$("$RUNNER_TEMP/registry-install/bin/tickertape" --version)" = "tickertape $VERSION"
          "$RUNNER_TEMP/registry-install/bin/tickertape" --help
      - name: Download every release file and check SHA256SUMS
        run: |
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern '*.tar.gz' --pattern '*.cdx.json' --dir downloaded
          cd downloaded
          sha256sum --check --strict SHA256SUMS
      - name: Verify build provenance and SBOM attestations (the commands in docs/install.md)
        working-directory: downloaded
        run: |
          for file in *.tar.gz *.cdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          for archive in *.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
          done
      - name: Smoke-test the Linux glibc archive, and the static archive in an empty root directory
        working-directory: downloaded
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            tar -xzf "tickertape-$RELEASE_TAG-$target.tar.gz"
          done
          test "$("tickertape-$RELEASE_TAG-x86_64-unknown-linux-gnu/tickertape" --version)" = "tickertape $VERSION"
          root="$(mktemp -d)"
          cp "tickertape-$RELEASE_TAG-x86_64-unknown-linux-musl/tickertape" "$root/"
          test "$(sudo chroot "$root" /tickertape --version)" = "tickertape $VERSION"
      - name: Install cargo-binstall
        if: needs.prepare.outputs.binstall == 'true'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-binstall@1.26.2
          fallback: none
      - name: Install the CLI with cargo-binstall from the release archive (static musl on Linux)
        if: needs.prepare.outputs.binstall == 'true'
        run: |
          cargo binstall "tickertape-cli@$VERSION" --no-confirm --no-track --disable-telemetry \
            --disable-strategies quick-install,compile --install-path "$RUNNER_TEMP/binstall"
          test "$("$RUNNER_TEMP/binstall/tickertape" --version)" = "tickertape $VERSION"
          cmp "$RUNNER_TEMP/binstall/tickertape" "downloaded/tickertape-$RELEASE_TAG-x86_64-unknown-linux-musl/tickertape"

  homebrew:
    needs: [prepare, verify]
    # Only after an authorized, verified publication; the token can push to the tap repository and nowhere else.
    if: always() && needs.verify.result == 'success' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      current: ${{ steps.formula.outputs.current }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thomas0903/homebrew-tap
          ref: main
          path: tap
          persist-credentials: false
      - name: Download SHA256SUMS from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir release
      - id: formula
        name: Generate Formula/tickertape.rb (an older tag never replaces a newer formula)
        run: python3 automation/.github/scripts/homebrew.py --tag "$RELEASE_TAG" --checksums release/SHA256SUMS --output tap/Formula/tickertape.rb
      - name: Push the formula to thomas0903/homebrew-tap
        if: steps.formula.outputs.current == 'true'
        working-directory: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git add Formula/tickertape.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "tickertape $RELEASE_TAG"
          # The token reaches git through a credential helper only; it is never part of a URL or command line.
          # The helper's own shell expands $1 and $TAP_TOKEN when git runs it, so they must stay in single quotes.
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c credential.helper='!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$TAP_TOKEN"; }; f' \
            push origin HEAD:main

  verify-homebrew:
    needs: [prepare, homebrew]
    if: always() && needs.homebrew.result == 'success' && needs.homebrew.outputs.current == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Install from the tap with Homebrew and run the formula's test
        run: |
          brew install thomas0903/tap/tickertape
          test "$(tickertape --version)" = "tickertape $VERSION"
          brew test thomas0903/tap/tickertape

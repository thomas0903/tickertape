name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-tooling:
    name: release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  bench-tooling:
    name: bench tooling (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      # Unit tests of the comparison runner (short and sustained mode) and the session runner; nothing is measured.
      - run: python3 -m unittest discover -s compare -p 'test_*.py' -v
      - run: python3 -m unittest discover -s benches -p 'test_*.py' -v

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the stable channel; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Compile the optional recorder; never connect to an external feed in CI.
      - run: cargo build -p tickertape-examples --features live --locked
        if: matrix.os == 'ubuntu-latest'
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  long-tests:
    name: long tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # 1M-record cross-process run, kill loops and other #[ignore]d tests, in release mode.
      - run: cargo test -p tickertape-tests --release --locked -- --ignored
      # Functional smoke only; never record CI timings as benchmark results.
      - name: Benchmark tools smoke
        run: |
          cargo build -p tickertape-bench --release --bins --locked
          target/release/tt-latency run --dir "$RUNNER_TEMP/tt-lat-smoke" --rate 20000 --count 20000 --payload 64 --reader mapped
          target/release/tt-checkpoint --dir "$RUNNER_TEMP/tt-ckpt-smoke" --payload 64 --batch 100 --checkpoints 2 --segment-size 65536
          target/release/tt-sustained run --dir "$RUNNER_TEMP/tt-sus-smoke" --out "$RUNNER_TEMP/tt-sus-smoke-out" \
            --rate 20000 --duration 3s --checkpoint-every 500ms --segment-size 1048576 --retain-segments 4 \
            --readers mapped,safe:durable:wait=block,safe:delay=100us

  # aarch64 Linux on GitHub's hosted arm64 runner (free for public repositories). The CRC code has
  # architecture-specific paths (crates/tickertape/src/crc.rs), so macOS arm64 does not cover this.
  check-linux-arm64:
    name: check (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes the format-v1 compatibility fixtures, the CLI and the Python decoder on them (ADR 0033).
      - run: cargo test --workspace --all-features --locked

  long-tests-linux-arm64:
    name: long tests (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The #[ignore]d tests, including a 20 s soak smoke (tests/soak.rs; the long soak runs in soak.yml).
      - run: cargo test -p tickertape-tests --release --locked -- --ignored
        env:
          TICKERTAPE_SOAK_ARTIFACTS: ${{ runner.temp }}/soak-failures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: soak-failure-ubuntu-24.04-arm
          path: ${{ runner.temp }}/soak-failures
          if-no-files-found: ignore
          retention-days: 30

  fuzz-linux-arm64:
    name: fuzz smoke (ubuntu-24.04-arm, 60 s per target)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target aarch64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  # Readers in the field may be older than the writer: every released version's readers and verify must see
  # exactly what the working tree's writer wrote (ADR 0033).
  compat-old-readers:
    name: old readers on new journals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - run: rustup show active-toolchain || rustup toolchain install
      - run: tests/compat/generate.sh --check-old-readers

  ffi:
    name: c abi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release workflow's build image: its older compilers (GCC 11, Clang 14) must accept
        # the headers too (the v0.5.0 tag's C library jobs failed on a warning only GCC 11 gives).
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The release scripts need Python 3.11+; Ubuntu 22.04 has 3.10 (the release workflow installs 3.12 too).
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: matrix.os == 'ubuntu-22.04'
        with:
          python-version: '3.12'
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      # The committed header must be exactly what cbindgen generates from the crate (ADR 0028).
      - name: Header drift check
        run: |
          cbindgen --config crates/tickertape-ffi/cbindgen.toml --crate tickertape-ffi --output crates/tickertape-ffi/include/tickertape.h
          git diff --exit-code -- crates/tickertape-ffi/include/tickertape.h
      # From 1.0, removing or changing a frozen declaration fails; additions pass (ADR 0028 -> Versioning).
      - name: ABI baseline check
        run: python3 .github/scripts/check_abi_baseline.py crates/tickertape-ffi/abi/tickertape-baseline.h crates/tickertape-ffi/include/tickertape.h
      # Rust tests of the extern "C" functions (with the core's failure points), then the C99/C11 programs, the C++
      # binding's programs (C++17, C++20, no exceptions; ADR 0036), examples and cross-language fixtures, compiled
      # with AddressSanitizer and UBSan, and the binding's compile-only matrix (C++17/20/23 with g++ and clang++).
      - name: C ABI tests (AddressSanitizer, UBSan)
        run: cargo test -p tickertape-ffi --locked --features fault-injection
        env:
          TICKERTAPE_FFI_SANITIZE: '1'
          TICKERTAPE_FFI_REQUIRE_PYTHON: '1'
      - name: C and C++ programs under Valgrind
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          cargo test -p tickertape-ffi --locked --test c_api
        env:
          TICKERTAPE_FFI_VALGRIND: '1'
          TICKERTAPE_FFI_REQUIRE_PYTHON: '1'
      - name: Examples build with make and CMake
        run: |
          cargo build --release -p tickertape-ffi --locked
          make -C examples/c
          cmake -S examples/c -B "$RUNNER_TEMP/examples"
          cmake --build "$RUNNER_TEMP/examples"
          cmake -S crates/tickertape-ffi/tests/cmake -B "$RUNNER_TEMP/cmake-subdir"
          cmake --build "$RUNNER_TEMP/cmake-subdir"
          "$RUNNER_TEMP/cmake-subdir/example" "$RUNNER_TEMP/journal" record 3
          "$RUNNER_TEMP/examples/example" "$RUNNER_TEMP/journal" replay
      # The C library archive as the release workflow builds it (ADR 0031), for the runner's platform and the
      # workspace version; the install test builds and runs the C and C++ examples from the unpacked archive alone,
      # through pkg-config, shared and static.
      - name: C library archive and its install test
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 .github/scripts/release.py c-build --source . --tag "v$version" --target "$target"
          python3 .github/scripts/release.py c-package --source . --tag "v$version" --target "$target" --output "$RUNNER_TEMP/c-dist"
          crates/tickertape-ffi/scripts/install-test.sh "$RUNNER_TEMP/c-dist/tickertape-c-v$version-$target.tar.gz" "$RUNNER_TEMP/c-install"

  # The Java binding (ADR 0037) on JDK 25 against the library built here: JUnit tests (with the cross-language and
  # released-format fixtures), then every Maven file the release publishes for this platform, unsigned (main JAR,
  # natives JAR, sources and Javadoc JARs), and an install test that runs the example from the built JARs.
  # Nothing is published.
  java:
    name: java binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # The job takes a few minutes. When the library fails to load, a test can wait forever (seen with a binding
    # version that did not match the header).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5'
          cache: maven
      # '25.0.5' resolves to Temurin 25.0.5+8 on Linux and to the macOS-only respin 25.0.5.1+2 on macOS (ADR 0037).
      - run: java -version
      - name: Maven
        run: command -v mvn || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends maven; }
      - name: Build libtickertape, the CLI and the C test programs
        run: echo "TT_NATIVE_DIR=$(bindings/java/scripts/build-native.sh)" >> "$GITHUB_ENV"
      # Everything Maven needs, before the build: with an empty cache, Maven Central once answered "not found" for a
      # plugin that exists (maven-resources-plugin 3.5.0, on one runner of three). Maven records such a miss, so a
      # retry forces an update (-U). Only resolution is retried, never the tests; the later steps find everything local.
      - name: Resolve Maven plugins and dependencies
        run: |
          for attempt in 1 2 3; do
            if mvn -B -ntp -U -f bindings/java/pom.xml -Pnatives,release dependency:go-offline; then
              exit 0
            fi
            echo "::warning::Maven resolution failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1
      # On the module path with --illegal-native-access=deny; missing tools (CLI, C programs, Python) fail the run.
      - name: Java tests
        run: mvn -B -ntp -f bindings/java/pom.xml verify -Dtickertape.native.dir="$TT_NATIVE_DIR" -Dtickertape.test.requireTools=true
      - name: Natives, sources and Javadoc JARs
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x86_64 ;;
            Linux-ARM64) platform=linux-aarch64 ;;
            macOS-ARM64) platform=macos-aarch64 ;;
            macOS-X64) platform=macos-x86_64 ;;
            *) echo "unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          bindings/java/scripts/stage-natives.sh "$TT_NATIVE_DIR" "$platform"
          mvn -B -ntp -f bindings/java/pom.xml -Pnatives,release package -DskipTests
          version=$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' bindings/java/pom.xml)
          for suffix in "" -sources -javadoc "-natives-$platform"; do
            test -s "bindings/java/target/tickertape-$version$suffix.jar"
          done
      - name: Install test from the built JARs
        run: bindings/java/scripts/install-test.sh "$RUNNER_TEMP/java-install"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --all-targets --locked
      # A 32-bit target, where the zero-copy reader must not map segments for reading (ADR 0027 → Supported targets).
      - run: rustup target add i686-unknown-linux-gnu --toolchain ${{ steps.msrv.outputs.version }}
      - run: cargo +${{ steps.msrv.outputs.version }} check -p tickertape --all-features --all-targets --target i686-unknown-linux-gnu --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # The Python bindings have their own lockfile (not a workspace member); same policy.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: bindings/python/Cargo.toml
          arguments: --config deny.toml
          command: check

  miri:
    # Also runs the C ABI's argument-handling tests. The name is a required status check on main; keep it.
    name: miri (format code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      # The format code, the CRC over shared words that the zero-copy reader validates with, and that reader's loads
      # over an anonymous mapping (ADR 0027).
      - run: cargo +nightly miri test -p tickertape --lib -- format crc map_ro
      # The C ABI's argument handling, error mapping and option builders (the tests that touch no files).
      - run: cargo +nightly miri test -p tickertape-ffi --lib pure_

  loom:
    name: loom (protocol model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p tickertape --lib --release --locked protocol_model
        env:
          RUSTFLAGS: --cfg loom

  fuzz:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Lint the fuzz crate (not a workspace member)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            # The prebuilt cargo-fuzz is a musl binary and would default to the musl target.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  duckdb:
    name: duckdb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb
      - name: Python read-only decoder
        run: |
          cargo build --release -p tickertape-cli -p tickertape-examples --locked
          python -m unittest discover -s python -v
        env:
          TICKERTAPE_BIN: target/release/tickertape
          TICKERTAPE_PRODUCER: target/release/demo-producer
      - run: cargo test -p tickertape-cli --locked duckdb_parquet_export -- --nocapture
        env:
          TICKERTAPE_REQUIRE_DUCKDB: '1'
          TICKERTAPE_PYTHON: ${{ steps.python.outputs.python-path }}
      # M8: the README quickstart, end to end (producer, live consumer, verify, Parquet export, DuckDB query).
      - run: examples/quickstart.sh "${{ steps.python.outputs.python-path }}"

  python-bindings:
    name: python bindings (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest and newest supported CPython (ADR 0029); the abi3 wheel built with one serves both.
        python: ['3.11', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      TICKERTAPE_BIN: ${{ github.workspace }}/target/release/tickertape
      TICKERTAPE_PRODUCER: ${{ github.workspace }}/target/release/demo-producer
      TICKERTAPE_DURABLE_HELPER: ${{ github.workspace }}/target/release/tt-durable-only
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/python -> target
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint the bindings crate (not a workspace member)
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --locked --all-features -- -D warnings
      - name: Unit tests of the bindings crate (every error and report variant converts as listed)
        run: |
          # The test binary links libpython; make the runtime linker find it on Linux.
          LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          cargo test --manifest-path bindings/python/Cargo.toml --locked
      - name: Build the Rust CLI and fixture helpers for the cross-language tests
        run: cargo build --release --locked -p tickertape-cli -p tickertape-examples -p tickertape-tests --bins
      - name: Build the wheel with the test hooks and install it into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip maturin==1.16.0 pytest mypy
          # `test-hooks` adds the test-only methods that can wedge a handle; release wheels never have them (ADR 0029).
          "$RUNNER_TEMP/venv/bin/maturin" build --release --locked --features test-hooks -m bindings/python/Cargo.toml \
            -o "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          # Optional integrations; a package without a wheel for this Python only skips its tests.
          for package in numpy pandas pyarrow duckdb; do
            "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: "$package" \
              || echo "::notice::$package has no wheel for Python ${{ matrix.python }}; its tests are skipped"
          done
      - name: Binding tests (pytest)
        working-directory: bindings/python
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -v'
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Type checks (mypy --strict, stubtest against the built module)
        working-directory: bindings/python
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m mypy
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -m mypy.stubtest tickertape

  # The iceoryx2 integration is outside the workspace (own lockfile and MSRV); these jobs only touch its directory.
  iceoryx2:
    name: iceoryx2 integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/iceoryx2
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/iceoryx2
          prefix-key: v0-rust-iceoryx2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      # The upstream CLI, for the test that plays an exported file with `iox2 service replay`. With
      # TICKERTAPE_REQUIRE_IOX2 set, that test fails instead of skipping when `iox2` is missing.
      - run: cargo install --locked iceoryx2-cli@0.10.0
      # Cross-process tests: publishers, recorders, live readers and subscribers on local shared memory; no network.
      - run: cargo test --all-features --locked
        env:
          TICKERTAPE_REQUIRE_IOX2: "1"
      # The default features (typed recorder and replayer, no `dynamic`) and no features at all (layout, catalog,
      # info and the live reader example, without iceoryx2).
      - run: cargo test --locked
      - run: cargo test --no-default-features --locked
      - run: cargo build --example follow --no-default-features --locked
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-default-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  iceoryx2-msrv:
    name: iceoryx2 integration msrv
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/iceoryx2
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the integration's Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/iceoryx2
          prefix-key: v0-rust-iceoryx2-msrv
      - run: cargo +${{ steps.msrv.outputs.version }} check --all-features --all-targets --locked

  iceoryx2-deny:
    name: cargo deny (iceoryx2 integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository's policy (deny.toml) against the integration's own lockfile.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: integrations/iceoryx2/Cargo.toml
          arguments: --all-features --config deny.toml
          command: check

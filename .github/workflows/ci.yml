name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the stable channel; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Compile the optional recorder; never connect to an external feed in CI.
      - run: cargo build -p tickertape-examples --features live --locked
        if: matrix.os == 'ubuntu-latest'
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  long-tests:
    name: long tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # 1M-record cross-process run, kill loops and other #[ignore]d tests, in release mode.
      - run: cargo test -p tickertape-tests --release --locked -- --ignored
      # Functional smoke only; never record CI timings as benchmark results.
      - name: Benchmark tools smoke
        run: |
          cargo build -p tickertape-bench --release --bins --locked
          target/release/tt-latency run --dir "$RUNNER_TEMP/tt-lat-smoke" --rate 20000 --count 20000 --payload 64 --reader mapped
          target/release/tt-checkpoint --dir "$RUNNER_TEMP/tt-ckpt-smoke" --payload 64 --batch 100 --checkpoints 2 --segment-size 65536

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --all-targets --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  miri:
    name: miri (format code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p tickertape --lib format

  loom:
    name: loom (protocol model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p tickertape --lib --release --locked protocol_model
        env:
          RUSTFLAGS: --cfg loom

  fuzz:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Lint the fuzz crate (not a workspace member)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            # The prebuilt cargo-fuzz is a musl binary and would default to the musl target.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  duckdb:
    name: duckdb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb
      - name: Python read-only decoder
        run: |
          cargo build --release -p tickertape-cli -p tickertape-examples --locked
          python -m unittest discover -s python -v
        env:
          TICKERTAPE_BIN: target/release/tickertape
          TICKERTAPE_PRODUCER: target/release/demo-producer
      - run: cargo test -p tickertape-cli --locked duckdb_parquet_export -- --nocapture
        env:
          TICKERTAPE_REQUIRE_DUCKDB: '1'
          TICKERTAPE_PYTHON: ${{ steps.python.outputs.python-path }}
      # M8: the README quickstart, end to end (producer, live consumer, verify, Parquet export, DuckDB query).
      - run: examples/quickstart.sh "${{ steps.python.outputs.python-path }}"

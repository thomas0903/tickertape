name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-tooling:
    name: release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  bench-tooling:
    name: bench tooling (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      # Unit tests of the comparison runner (short and sustained mode) and the session runner; nothing is measured.
      - run: python3 -m unittest discover -s compare -p 'test_*.py' -v
      - run: python3 -m unittest discover -s benches -p 'test_*.py' -v

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the stable channel; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Compile the optional recorder; never connect to an external feed in CI.
      - run: cargo build -p tickertape-examples --features live --locked
        if: matrix.os == 'ubuntu-latest'
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  long-tests:
    name: long tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # 1M-record cross-process run, kill loops and other #[ignore]d tests, in release mode.
      - run: cargo test -p tickertape-tests --release --locked -- --ignored
      # Functional smoke only; never record CI timings as benchmark results.
      - name: Benchmark tools smoke
        run: |
          cargo build -p tickertape-bench --release --bins --locked
          target/release/tt-latency run --dir "$RUNNER_TEMP/tt-lat-smoke" --rate 20000 --count 20000 --payload 64 --reader mapped
          target/release/tt-checkpoint --dir "$RUNNER_TEMP/tt-ckpt-smoke" --payload 64 --batch 100 --checkpoints 2 --segment-size 65536
          target/release/tt-sustained run --dir "$RUNNER_TEMP/tt-sus-smoke" --out "$RUNNER_TEMP/tt-sus-smoke-out" \
            --rate 20000 --duration 3s --checkpoint-every 500ms --segment-size 1048576 --retain-segments 4 \
            --readers mapped,safe:durable:wait=block,safe:delay=100us

  # aarch64 Linux on GitHub's hosted arm64 runner (free for public repositories). The CRC code has
  # architecture-specific paths (crates/tickertape/src/crc.rs), so macOS arm64 does not cover this.
  check-linux-arm64:
    name: check (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes the format-v1 compatibility fixtures, the CLI and the Python decoder on them (ADR 0033).
      - run: cargo test --workspace --all-features --locked

  long-tests-linux-arm64:
    name: long tests (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The #[ignore]d tests, including a 20 s soak smoke (tests/soak.rs; the long soak runs in soak.yml).
      - run: cargo test -p tickertape-tests --release --locked -- --ignored
        env:
          TICKERTAPE_SOAK_ARTIFACTS: ${{ runner.temp }}/soak-failures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: soak-failure-ubuntu-24.04-arm
          path: ${{ runner.temp }}/soak-failures
          if-no-files-found: ignore
          retention-days: 30

  fuzz-linux-arm64:
    name: fuzz smoke (ubuntu-24.04-arm, 60 s per target)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target aarch64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  # Readers in the field may be older than the writer: every released version's readers and verify must see
  # exactly what the working tree's writer wrote (ADR 0033).
  compat-old-readers:
    name: old readers on new journals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - run: rustup show active-toolchain || rustup toolchain install
      - run: tests/compat/generate.sh --check-old-readers

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --all-targets --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # The Python bindings have their own lockfile (not a workspace member); same policy.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: bindings/python/Cargo.toml
          arguments: --config deny.toml
          command: check

  miri:
    name: miri (format code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p tickertape --lib format

  loom:
    name: loom (protocol model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p tickertape --lib --release --locked protocol_model
        env:
          RUSTFLAGS: --cfg loom

  fuzz:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Lint the fuzz crate (not a workspace member)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            # The prebuilt cargo-fuzz is a musl binary and would default to the musl target.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  duckdb:
    name: duckdb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb
      - name: Python read-only decoder
        run: |
          cargo build --release -p tickertape-cli -p tickertape-examples --locked
          python -m unittest discover -s python -v
        env:
          TICKERTAPE_BIN: target/release/tickertape
          TICKERTAPE_PRODUCER: target/release/demo-producer
      - run: cargo test -p tickertape-cli --locked duckdb_parquet_export -- --nocapture
        env:
          TICKERTAPE_REQUIRE_DUCKDB: '1'
          TICKERTAPE_PYTHON: ${{ steps.python.outputs.python-path }}
      # M8: the README quickstart, end to end (producer, live consumer, verify, Parquet export, DuckDB query).
      - run: examples/quickstart.sh "${{ steps.python.outputs.python-path }}"

  python-bindings:
    name: python bindings (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest and newest supported CPython (ADR 0029); the abi3 wheel built with one serves both.
        python: ['3.11', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      TICKERTAPE_BIN: ${{ github.workspace }}/target/release/tickertape
      TICKERTAPE_PRODUCER: ${{ github.workspace }}/target/release/demo-producer
      TICKERTAPE_DURABLE_HELPER: ${{ github.workspace }}/target/release/tt-durable-only
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/python -> target
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint the bindings crate (not a workspace member)
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --locked -- -D warnings
      - name: Unit tests of the bindings crate (every error and report variant converts as listed)
        run: |
          # The test binary links libpython; make the runtime linker find it on Linux.
          LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          cargo test --manifest-path bindings/python/Cargo.toml --locked
      - name: Build the Rust CLI and fixture helpers for the cross-language tests
        run: cargo build --release --locked -p tickertape-cli -p tickertape-examples -p tickertape-tests --bins
      - name: Build the wheel and install it into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip maturin==1.16.0 pytest mypy
          "$RUNNER_TEMP/venv/bin/maturin" build --release --locked -m bindings/python/Cargo.toml -o "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          # Optional integrations; a package without a wheel for this Python only skips its tests.
          for package in numpy pandas pyarrow duckdb; do
            "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: "$package" \
              || echo "::notice::$package has no wheel for Python ${{ matrix.python }}; its tests are skipped"
          done
      - name: Binding tests (pytest)
        working-directory: bindings/python
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -v'
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Type checks (mypy --strict, stubtest against the built module)
        working-directory: bindings/python
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m mypy
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -m mypy.stubtest tickertape


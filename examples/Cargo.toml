[package]
name = "tickertape-examples"
description = "End-to-end examples for tickertape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
live = ["dep:tungstenite", "dep:serde_json", "dep:ctrlc"]

[dependencies]
tickertape.workspace = true
ctrlc = { version = "3.5.1", optional = true }
serde_json = { version = "1.0", optional = true }
tungstenite = { version = "0.30", features = ["native-tls"], optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[[bin]]
name = "demo-producer"
path = "src/bin/demo-producer.rs"

[[bin]]
name = "demo-consumer"
path = "src/bin/demo-consumer.rs"

[[bin]]
name = "binance-recorder"
path = "src/bin/binance-recorder.rs"
required-features = ["live"]

[lints]
workspace = true
